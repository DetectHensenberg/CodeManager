# setting for adminer
Alias /adminer "%APP_PATH%ztadmin/"
<Directory "%APP_PATH%ztadmin">
  AllowOverride AuthConfig
  Require all granted
  Order deny,allow
  Deny from all
  Allow from 127.0.0.1

  <Files "index.php">
    SetHandler application/x-httpd-php
  </Files>

</Directory>
<DirectoryMatch "%APP_PATH%ztadmin/.+/.*">
  <FilesMatch ".+\.ph(p[3457]?|t|tml)$">
    SetHandler text/plain
  </FilesMatch>
</DirectoryMatch>


